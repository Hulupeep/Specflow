contract_meta:
  id: feature_improve_controller
  version: 2
  created_from_spec: "GitHub #181; docs/specs/improve-controller/preparation.md"
  covers_reqs: [AC-STORE-1, AC-STORE-2, AC-STORE-3, AC-STORE-4, AC-09-1, AC-09-2, AC-09-3, AC-09-4, AC-09-5, AC-LIMITS-01, AC-LIMITS-02, AC-LIMITS-03, AC-LIMITS-04, AC-LIMITS-05, AC-LIMITS-06, AC-LIMITS-07, AC-LIMITS-08, AC-LIMITS-09, AC-LIMITS-10, AC-LIMITS-11, AC-LIMITS-12, AC-LIMITS-13]
  owner: specflow-core
llm_policy:
  enforce: true
  llm_may_modify_non_negotiables: false
  override_phrase: "override_contract: feature_improve_controller"
invariants:
  - id: I-CONTROLLER-001
    rule: "Authenticate from trusted host and current same-revision profile authority before private lookup/admission/protected start. Owner-registered policy and canonical repo identity cannot come from untrusted caller commands or principal claims."
    tests: [CTRL-AUTH, CTRL-IDENTITY]
  - id: I-CONTROLLER-002
    rule: "Durably bind request identity, original limits, absolute deadline and canonical repo ownership before launch; duplicate requests cannot reset limits or re-execute after completion. One owner across manual/timer/alias races."
    tests: [CTRL-IDENTITY, CTRL-RACE, CTRL-INTERRUPT]
  - id: I-CONTROLLER-003
    rule: "Reserve every cycle and native provider inference start before execution; all roles/retries/fallbacks share finite original counters. Unknown starts stay consumed and no protected start can pass an exhausted bound."
    tests: [CTRL-LIMITS, CTRL-INTERRUPT]
  - id: I-CONTROLLER-004
    rule: "Only the exact independently verified core ledger and authenticated durable worker result allow terminal cycle advancement. Uncertain/missing/corrupt evidence quarantines ownership; controller cannot invent a core decision or replay a consumed holdout."
    tests: [CTRL-TERMINAL, CTRL-INTERRUPT]
  - id: I-CONTROLLER-005
    rule: "Structured status retains precise primary/all reasons, stage, last action, failed check/evidence, original/remaining limits and one recovery action. Subscription estimates are partial telemetry; unmeasured actual-spend ceilings are rejected, never treated as exhausted spend or authority for API fallback."
    tests: [CTRL-LIMITS, CTRL-NOWORK, CTRL-AUTH]
  - id: I-CONTROLLER-006
    rule: "Creator-bound daily slot identity survives profile edits/replay; earliest UTC wins ambiguous slots, nonexistent slots skip, late slots miss. Pause/disable fence future admission, cancellation separately fences active work. Live activation remains unavailable until #183 proof."
    tests: [CTRL-SCHEDULE, CTRL-AUTH]
  - id: I-CONTROLLER-007
    rule: "Empty opportunity selection creates no patch/PR; retained KEEP pauses all repo work pending authenticated owner decision. Cycle count and controller completion are never proof of product gain."
    tests: [CTRL-NOWORK, CTRL-TERMINAL]
  - id: I-CONTROLLER-008
    rule: "Atomic durable ordering acknowledges only committed state. Storage/lock/process uncertainty fails closed and preserves original limits, evidence and ownership for #183 reconciliation; no automatic takeover/resume or live scheduler is implemented here."
    tests: [CTRL-RACE, CTRL-INTERRUPT, STORE-READ]
test_hooks:
  tests:
    - file: tests/contracts/controller-stage-deadline.test.js
    - file: tests/contracts/controller-store-read.test.js
    - file: tests/contracts/improve-limits.test.js
    - file: tests/integration/improve-controller.test.js
