contract_meta:
  id: feature_input_capsule
  version: 1
  created_from_spec: "GitHub #282; docs/specs/improve-worker/capsule-design.md"
  covers_reqs: [REQ-CAPSULE-01, REQ-CAPSULE-02, REQ-CAPSULE-03, REQ-CAPSULE-04]
  owner: specflow-core
llm_policy:
  enforce: true
  llm_may_modify_non_negotiables: false
  override_phrase: "override_contract: feature_input_capsule"
invariants:
  - id: I-CAPSULE-001
    rule: "A complete canonical manifest binds regular bytes, modes, directories and closed-graph relative links; missing, extra or changed content cannot retain admission."
    tests: [capsule-round-trip, capsule-mutation, capsule-canonical-manifest]
  - id: I-CAPSULE-002
    rule: "Bounded no-follow capture/import never follows host-directed links or admits hardlinks, special files, privileged modes or partial/raced input."
    tests: [capsule-unsafe-graph, capsule-resource-limits, capsule-filesystem-races]
  - id: I-CAPSULE-003
    rule: "Admission requires complete validation, durable no-replace commit and confirmed parent sync. Recovery cannot infer completeness or overwrite conflicting identity."
    tests: [capsule-persistence-faults, capsule-lost-ack, capsule-no-replace]
  - id: I-CAPSULE-004
    rule: "Only the current job-owned paused worker may be captured; trusted recipe/input/manifest identity and complete bytes are checked before read-only use. Ordinary evidence capture and existing holdout authority stay unchanged."
    tests: [capsule-worker-authority, capsule-launcher-identity, capsule-evidence-separation]
test_hooks:
  tests:
    - file: tests/contracts/improve-worker-capsule.test.js
    - file: tests/integration/improve-worker-capsule.test.js
    - file: tests/contracts/improve-worker.test.js
