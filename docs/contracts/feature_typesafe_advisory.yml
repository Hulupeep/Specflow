llm_policy:
  enforce: true
  llm_may_modify_non_negotiables: false
  override_phrase: "override_contract: feature_typesafe_advisory"
invariants:
  - id: I-TSAFE-001
    rule: Bounded requests and durable records exclude credentials and never invent successful provider results.
  - id: I-TSAFE-002
    rule: Judgment and replay identity bind to exact selected state, snapshot, question set and model; stale advice cannot verify acceptance.
  - id: I-TSAFE-003
    rule: Advice cannot override ownership, independent review, gates, finding closure or repair budgets.
  - id: I-TSAFE-004
    rule: Private evaluations retain missing outcomes, provenance and family-separated held-out cases; simulated and replay evidence is labelled.
test_hooks:
  tests:
