contract_meta:
  id: feature_offline_inputs
  version: 1
  created_from_spec: "GitHub #284; docs/specs/improve-worker/offline-inputs-design.md"
  covers_reqs: [REQ-OFFLINE-01, REQ-OFFLINE-02, REQ-OFFLINE-03, REQ-OFFLINE-04]
  owner: specflow-core
llm_policy:
  enforce: true
  llm_may_modify_non_negotiables: false
  override_phrase: "override_contract: feature_offline_inputs"
invariants:
  - id: I-OFFLINE-001
    rule: "Offline acquisition binds complete package, lock, tool, store, effective configuration, platform and resource identities; a changed input cannot retain a consumable receipt."
    tests: [offline-recipe-identity, offline-input-mutation]
  - id: I-OFFLINE-002
    rule: "Only a job-owned confined setup worker installs from a verified private read-only store, with frozen lock, copy import and disabled scripts/config hooks; unsupported graph forms and cache misses never enable network or host execution."
    tests: [offline-real-target, offline-hooks-controls, offline-graph-rejection, offline-cache-miss]
  - id: I-OFFLINE-003
    rule: "Explicit finite aggregate resource profiles preserve legacy defaults and reject mount shadowing before creation; exhaustion or interruption admits no output and leaves no owned worker."
    tests: [offline-resource-profile, offline-mount-shadowing, offline-exhaustion, offline-interruption]
  - id: I-OFFLINE-004
    rule: "Approved source-cache hardlinks become independently verified single-link output inside confinement; unchanged capsule admission, launcher pins, same-job read-only reuse and ordinary evidence separation remain authoritative."
    tests: [offline-cache-copy, offline-source-race, offline-fresh-consumer, offline-launcher-pins]
test_hooks:
  tests:
    - file: tests/contracts/improve-offline-inputs.test.js
    - file: tests/integration/improve-offline-inputs.test.js
