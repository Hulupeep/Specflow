defaults:
  confirm_models: true
  reason: Confirm model choices before spending budget or Codex plan quota.
routing_profile:
  id: claude-code-large
  runtime: claude-code
  template: claude-code-large-routing.yml
  normal_review:
    method: fresh-native
    policy: fable-reviewer
policies:
  fable-planner:
    adapter_policy:
      id: fable-planner
      provider: claude-print
      command: claude
      role: planner
      effort: xhigh
      args:
        - '-p'
        - '--output-format'
        - stream-json
        - '--permission-mode'
        - dontAsk
        - '--verbose'
        - '--no-session-persistence'
      model: claude-fable-5
      requested_model: claude-fable-5
      fallback_model: claude-opus-4-8
      billing: unknown
      cost: unknown
      timeout_seconds: 1800
      max_iterations: 1
      allowed_tools:
        - Read
        - Grep
        - Glob
        - Write
        - Edit
      denied_tools:
        - Bash(git push *)
        - Bash(gh pr create *)
        - Bash(gh pr merge *)
        - Bash(* deploy *)
        - Bash(* --no-verify *)
      transcript_path: .specflow/runs/<slug>/adapter/fable-planner.jsonl
      output_path: .specflow/runs/<slug>/adapter/fable-planner.md
      never_without_human:
        - git push
        - open PR
        - merge
        - production deploy
        - '--no-verify'
        - override contract
  fable-reviewer:
    adapter_policy:
      id: fable-reviewer
      provider: claude-print
      command: claude
      role: verifier
      effort: xhigh
      args:
        - '-p'
        - '--output-format'
        - stream-json
        - '--permission-mode'
        - dontAsk
        - '--verbose'
        - '--no-session-persistence'
      model: claude-fable-5
      requested_model: claude-fable-5
      fallback_model: claude-opus-4-8
      billing: unknown
      cost: unknown
      timeout_seconds: 1800
      max_iterations: 1
      allowed_tools:
        - Read
        - Grep
        - Glob
      denied_tools:
        - Bash(git push *)
        - Bash(gh pr create *)
        - Bash(gh pr merge *)
        - Bash(* deploy *)
        - Bash(* --no-verify *)
      transcript_path: .specflow/runs/<slug>/adapter/fable-reviewer.jsonl
      output_path: .specflow/runs/<slug>/adapter/fable-reviewer.md
      never_without_human:
        - git push
        - open PR
        - merge
        - production deploy
        - '--no-verify'
        - override contract
  claude-coder:
    adapter_policy:
      id: claude-coder
      provider: claude-print
      command: claude
      role: implementer
      effort: medium
      args:
        - '-p'
        - '--output-format'
        - stream-json
        - '--verbose'
        - '--permission-mode'
        - dontAsk
        - '--no-session-persistence'
      model: claude-fable-5
      requested_model: claude-fable-5
      billing: unknown
      cost: unknown
      timeout_seconds: 1800
      max_iterations: 1
      allowed_tools:
        - Read
        - Grep
        - Glob
        - Write
        - Edit
        - Bash
      denied_tools:
        - Bash(git push *)
        - Bash(gh pr create *)
        - Bash(gh pr merge *)
        - Bash(* deploy *)
        - Bash(* --no-verify *)
      transcript_path: .specflow/runs/<slug>/adapter/claude-coder.jsonl
      output_path: .specflow/runs/<slug>/adapter/claude-coder.md
      never_without_human:
        - git push
        - open PR
        - merge
        - production deploy
        - '--no-verify'
        - override contract
routes:
  spec-build:
    discover:
      policy: fable-planner
      reason: expensive product/requirements thinking
    draft:
      policy: fable-planner
      reason: expensive PRD shaping
    adversary:
      policy: fable-reviewer
      reason: expensive adversarial review and falsification
    tickets:
      policy: claude-coder
      reason: ticket writing is bounded implementation prep
  feature-build:
    2_contract:
      policy: claude-coder
      reason: contract expansion from accepted ticket
    3_e2e:
      policy: claude-coder
      reason: test authoring
    4_oracle:
      policy: claude-coder
      reason: oracle/provenance wiring
    5_impl:
      policy: claude-coder
      reason: implementation and local verification
    5_review:
      policy: fable-reviewer
      reason: fresh read-only advisory review; Gate C remains authoritative
